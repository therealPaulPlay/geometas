<figure class="mt-6 {{ max_width|default:'max-w-3xl' }}">
    <img src="{{ image_url }}" alt="{{ image_alt }}" loading="lazy"
        class="w-full rounded-md border border-stone-200">
    <figcaption class="mt-2 font-light italic text-stone-600 leading-snug text-sm">{{ caption }}</figcaption>
</figure>
