<div class="mt-4 max-w-4xl overflow-x-auto">
    <table class="w-full min-w-[36rem] text-left border-collapse">
        <thead>
            <tr class="border-b-2 border-stone-300">
                <th scope="col" class="py-2 pr-3 w-1/5 text-sm font-medium text-stone-500">{{ label|default:"" }}</th>
                <th scope="col" class="py-2 px-3 text-base font-semibold text-stone-800">{{ col_a }}</th>
                <th scope="col" class="py-2 pl-3 text-base font-semibold text-stone-800">{{ col_b }}</th>
            </tr>
        </thead>
        <tbody>
            {{ children }}
        </tbody>
    </table>
</div>
